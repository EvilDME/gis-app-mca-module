services:
  # Сервис базы данных
  db:
    image: postgis/postgis:16-3.4
    container_name: gis_postgis_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql

  # MinIO объектное хранилище
  minio:
    image: minio/minio:latest
    container_name: gis_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Убрал MINIO_SERVER_URL - она не нужна для внутренних обращений и может мешать
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Инициализация бакета, публичный доступ и CORS
  minio-init:
    image: minio/mc:latest
    container_name: gis_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Ожидание MinIO...';
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} 2>/dev/null; do
        sleep 2;
      done;
      echo 'Создание бакета ${MINIO_BUCKET:-rasters} (если не существует)';
      mc mb local/${MINIO_BUCKET:-rasters} --ignore-existing;
      echo 'Открываем публичный доступ на чтение для бакета';
      mc anonymous set public local/${MINIO_BUCKET:-rasters};
      echo 'Настройка CORS (разрешаем запросы из браузера)';
      echo '[{
        \"AllowedHeaders\": [\"*\"],
        \"AllowedMethods\": [\"GET\", \"HEAD\"],
        \"AllowedOrigins\": [\"*\"],
        \"ExposeHeaders\": [\"ETag\"],
        \"MaxAgeSeconds\": 3600
      }]' > /tmp/cors.json;
      mc cors set local/${MINIO_BUCKET:-rasters} /tmp/cors.json;
      echo 'Инициализация MinIO завершена. Бакет: ${MINIO_BUCKET:-rasters} доступен по ссылке: http://localhost:9000/${MINIO_BUCKET:-rasters}/'
      "

  # Твое приложение
  gis-service:
    image: my-gis-app:latest
    build: .
    container_name: gis_mca_app
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-rasters}
      - MINIO_SECURE=False
      - JWT_SECRET=${JWT_SECRET}
      - PYTHONUNBUFFERED=1
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
  minio_data: